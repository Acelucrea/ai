<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Lawyer Live Call</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b0f14;color:white;font-family:sans-serif}
.video-box{background:#111;border-radius:20px;overflow:hidden;position:relative}
.status{position:absolute;top:10px;right:10px;background:#10b981;padding:6px 12px;border-radius:20px;font-size:12px}
.controls button{border-radius:50%;width:60px;height:60px}
</style>
</head>
<body>
<div class="p-6 max-w-7xl mx-auto">
<h1 class="text-2xl mb-4">AI Lawyer Live Consultation</h1>

<div class="grid lg:grid-cols-12 gap-6">

<div class="lg:col-span-8 video-box p-4">
<div class="grid grid-cols-2 gap-4">

<div class="video-box h-64 flex items-center justify-center">YOU</div>

<div class="video-box h-64 flex items-center justify-center">
AI LAWYER
<div id="aiStatus" class="status">Listening</div>
</div>

</div>

<div class="controls flex justify-center gap-6 mt-6">
<button onclick="toggleMic()" class="bg-gray-700">🎤</button>
<button onclick="startCall()" class="bg-green-500">▶</button>
<button onclick="endCall()" class="bg-red-500">⛔</button>
</div>
</div>

<div class="lg:col-span-4 bg-[#111] p-4 rounded-xl">
<h2 class="text-sm text-green-400 mb-3">Live Transcript</h2>
<div id="chat" class="h-80 overflow-y-auto text-sm"></div>
</div>

</div>
</div>

<script>
let recognition;

function addMessage(sender,text){
const div=document.createElement('div');
div.innerHTML=`<b>${sender}:</b> ${text}`;
document.getElementById('chat').appendChild(div);
}

function startCall(){
addMessage('AI','Hello, I am your AI lawyer. How can I help you?');
startSpeech();
}

function startSpeech(){
recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.continuous=true;
recognition.onresult=(e)=>{
let text=e.results[e.results.length-1][0].transcript;
addMessage('You',text);
respond(text);
};
recognition.start();
}

function respond(text){
document.getElementById('aiStatus').innerText='Thinking';
setTimeout(()=>{
let reply='Based on Nigerian law, you have rights. Please consult a lawyer.';
addMessage('AI',reply);
speak(reply);
document.getElementById('aiStatus').innerText='Listening';
},1000);
}

function speak(text){
let u=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(u);
}

function toggleMic(){
if(recognition) recognition.stop();
}

function endCall(){
if(recognition) recognition.stop();
location.reload();
}
</script>

</body>
</html>
